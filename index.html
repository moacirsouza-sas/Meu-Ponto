
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Pro | Teste de GPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --success: #10b981; --danger: #ef4444; --bg: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-sub: #6b7280; --border: #e5e7eb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 450px; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border); }
        .btn-ponto { width: 100%; height: 64px; background: var(--primary); color: white; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); margin-bottom: 24px; }
        .btn-ponto:disabled { background: #9ca3af; cursor: wait; box-shadow: none; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .input-box { background: #f9fafb; border: 1px solid var(--border); border-radius: 14px; padding: 12px; position: relative; }
        .input-box.unlocked { border-color: var(--success); background: #f0fdf4; }
        .input-box label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-box input { width: 100%; border: none; background: transparent; font-size: 1.125rem; font-weight: 600; outline: none; }
        .edit-trigger { position: absolute; right: 10px; bottom: 12px; cursor: pointer; color: var(--primary); font-size: 1.2rem; }
        .timer-section { text-align: center; padding: 16px; background: #f8faff; border-radius: 16px; margin-bottom: 16px; }
        #timer { font-size: 2.25rem; font-weight: 800; color: var(--primary); }
        .geo-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #374151; color: #fff; border-radius: 20px; font-size: 0.65rem; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header style="text-align: center; margin-bottom: 20px;">
            <h1 style="color: var(--primary); font-weight: 800;">Ponto Pro</h1>
            <p style="color: var(--text-sub); font-size: 0.9rem;">Teste de Auditoria de Localização</p>
        </header>

        <div class="card">
            <button id="btnPrincipal" class="btn-ponto" onclick="tentarCapturarGPS('auto')">
                📍 Registrar Ponto
            </button>

            <div class="grid-inputs">
                <div class="input-box" id="box-entrada">
                    <label>Entrada</label>
                    <input type="time" id="entrada" readonly>
                    <span class="edit-trigger" onclick="tentarCapturarGPS('manual', 'entrada')">✎</span>
                </div>
                <div class="input-box" id="box-saida">
                    <label>Saída Final</label>
                    <input type="time" id="saida" readonly>
                    <span class="edit-trigger" onclick="tentarCapturarGPS('manual', 'saida')">✎</span>
                </div>
            </div>

            <div class="timer-section">
                <div id="timer">00:00:00</div>
                <div id="geoDisplay" class="geo-badge">GPS: Aguardando Comando</div>
            </div>
        </div>
    </div>

    <script>
        function tentarCapturarGPS(modo, campoID = null) {
            const btn = document.getElementById('btnPrincipal');
            const display = document.getElementById('geoDisplay');

            btn.disabled = true;
            display.innerText = "🛰️ Buscando satélites...";

            // Configurações de alta precisão
            const options = {
                enableHighAccuracy: true,
                timeout: 10000, // 10 segundos para desistir
                maximumAge: 0   // Forçar localização atual, não cacheada
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    display.innerText = `📍 ${lat.toFixed(5)}, ${lon.toFixed(5)} (+/- ${accuracy.toFixed(0)}m)`;
                    
                    if (modo === 'auto') {
                        const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                        if (!document.getElementById('entrada').value) {
                            preencher('entrada', agora);
                        } else {
                            preencher('saida', agora);
                        }
                    } else {
                        preencher(campoID, document.getElementById(campoID).value || "00:00");
                        alert("GPS Validado! Edição liberada para este campo.");
                    }
                    
                    btn.disabled = false;
                },
                (error) => {
                    btn.disabled = false;
                    let msg = "";
                    switch(error.code) {
                        case error.PERMISSION_DENIED: msg = "Usuário negou o GPS."; break;
                        case error.POSITION_UNAVAILABLE: msg = "Localização indisponível."; break;
                        case error.TIMEOUT: msg = "Tempo esgotado ao buscar GPS."; break;
                        default: msg = "Erro desconhecido no GPS."; break;
                    }
                    display.innerText = "❌ " + msg;
                    alert("Atenção: " + msg + "\nCertifique-se de estar usando HTTPS e com o GPS ligado.");
                },
                options
            );
        }

        function preencher(id, valor) {
            const el = document.getElementById(id);
            el.value = valor;
            el.readOnly = false;
            document.getElementById(`box-${id}`).classList.add('unlocked');
        }
    </script>
</body>
</html>
