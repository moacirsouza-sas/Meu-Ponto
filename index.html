
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Pro | Sistema de Auditoria V9</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #6b7280;
            --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container { width: 100%; max-width: 450px; }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

        .btn-ponto {
            width: 100%;
            height: 64px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            margin-bottom: 24px;
        }

        .btn-ponto:disabled { background: #9ca3af; box-shadow: none; cursor: wait; }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-box {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            position: relative;
            transition: 0.3s;
        }

        .input-box.unlocked {
            border-color: var(--success);
            background: #f0fdf4;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .input-box label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-box input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }

        .input-box input[readonly] { cursor: not-allowed; color: #9ca3af; }

        .edit-trigger {
            position: absolute;
            right: 12px;
            bottom: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
            background: #eff6ff;
            border-radius: 6px;
        }

        .timer-section {
            text-align: center;
            padding: 16px;
            background: #f8faff;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        #timer { font-size: 2.25rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }

        .geo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #1f2937;
            color: #fff;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .btn-finish {
            width: 100%;
            padding: 16px;
            background: var(--text-main);
            color: white;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-secondary {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-secondary:hover { background: #f9fafb; }
        .btn-danger-light { color: var(--danger); border-color: #fee2e2; }
        .btn-success-light { color: var(--success); border-color: #dcfce7; }

        .history-title { font-size: 1rem; font-weight: 700; margin: 24px 0 12px 0; width: 100%; }
        
        .day-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            width: 100%;
        }

        .saldo-badge {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Ponto Pro</h1>
            <p id="display-date" style="color: var(--text-sub); font-size: 0.85rem; margin-top: 4px;"></p>
        </header>

        <div class="card">
            <button id="btnPrincipal" class="btn-ponto" onclick="processarGeolocalizacao('auto')">
                <span>📍</span> Registrar Agora
            </button>

            <div class="grid-inputs">
                <div class="input-box" id="box-entrada">
                    <label>Entrada</label>
                    <input type="time" id="entrada" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" onclick="processarGeolocalizacao('manual', 'entrada')">✎</span>
                </div>
                <div class="input-box" id="box-almocoSai">
                    <label>Saída Almoço</label>
                    <input type="time" id="almocoSai" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" onclick="processarGeolocalizacao('manual', 'almocoSai')">✎</span>
                </div>
                <div class="input-box" id="box-almocoVolta">
                    <label>Volta Almoço</label>
                    <input type="time" id="almocoVolta" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" onclick="processarGeolocalizacao('manual', 'almocoVolta')">✎</span>
                </div>
                <div class="input-box" id="box-saida">
                    <label>Saída Final</label>
                    <input type="time" id="saida" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" onclick="processarGeolocalizacao('manual', 'saida')">✎</span>
                </div>
            </div>

            <div class="timer-section">
                <div id="timer">00:00:00</div>
                <div id="geoDisplay" class="geo-badge">GPS Obrigatório</div>
            </div>

            <button class="btn-finish" onclick="arquivarDia()">Arquivar Registro do Dia</button>
            
            <div class="actions-grid">
                <button class="btn-secondary btn-danger-light" onclick="resetarRascunho()">🗑️ Resetar Dia</button>
                <button class="btn-secondary btn-success-light" onclick="exportarCSV()">📊 Baixar CSV</button>
            </div>
            
            <button class="btn-secondary" style="width: 100%; margin-top: 10px;" onclick="abrirPlanilha()">
                🌐 Abrir Planilha Google
            </button>
        </div>

        <h3 class="history-title">Histórico Recente</h3>
        <div id="lista-historico"></div>
    </div>

    <script>
        const CAMPOS = ['entrada', 'almocoSai', 'almocoVolta', 'saida'];
        let registroGeos = {};

        document.getElementById('display-date').innerText = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'full' }).format(new Date());

        window.onload = () => {
            const rascunho = JSON.parse(localStorage.getItem('ponto_v9_save') || '{}');
            registroGeos = rascunho.geos || {};
            
            CAMPOS.forEach(id => {
                if (rascunho[id]) {
                    const el = document.getElementById(id);
                    el.value = rascunho[id];
                    el.removeAttribute('readonly'); 
                    document.getElementById(`box-${id}`).classList.add('unlocked');
                }
            });
            renderizarHistorico();
            atualizarTimer();
        };

        function processarGeolocalizacao(modo, alvo = null) {
            const status = document.getElementById('geoDisplay');
            status.innerHTML = "<span>🛰️</span> Capturando GPS...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const latLon = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                    status.innerHTML = `<span>✅</span> ${latLon}`;
                    
                    if (modo === 'auto') {
                        executarBatidaAuto(latLon);
                    } else {
                        liberarCampoManual(alvo, latLon);
                    }
                },
                (err) => {
                    alert("Erro: O acesso ao GPS é obrigatório para registrar o ponto.");
                    status.innerHTML = "<span>❌</span> GPS Necessário";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function executarBatidaAuto(geo) {
            const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            for (let id of CAMPOS) {
                const input = document.getElementById(id);
                if (!input.value) {
                    input.removeAttribute('readonly'); 
                    input.value = hora;
                    document.getElementById(`box-${id}`).classList.add('unlocked');
                    registroGeos[id] = `Auto: ${geo}`;
                    salvarRascunho();
                    break;
                }
            }
        }

        function liberarCampoManual(id, geo) {
            const input = document.getElementById(id);
            input.removeAttribute('readonly'); 
            input.focus();
            document.getElementById(`box-${id}`).classList.add('unlocked');
            registroGeos[id] = `Manual: ${geo}`;
            salvarRascunho();
        }

        function salvarRascunho() {
            const data = { geos: registroGeos };
            CAMPOS.forEach(id => data[id] = document.getElementById(id).value);
            localStorage.setItem('ponto_v9_save', JSON.stringify(data));
        }

        function resetarRascunho() {
            if (confirm("Deseja apagar os registros de hoje?")) {
                localStorage.removeItem('ponto_v9_save');
                location.reload();
            }
        }

        function arquivarDia() {
            const ent = document.getElementById('entrada').value;
            const sai = document.getElementById('saida').value;
            if (!ent || !sai) return alert("Pelo menos Entrada e Saída são necessárias.");

            const db = JSON.parse(localStorage.getItem('ponto_v9_db') || '[]');
            const diff = (new Date(`1970-01-01T${sai}`) - new Date(`1970-01-01T${ent}`)) / 60000;
            
            db.push({
                data: new Date().toLocaleDateString('pt-BR'),
                entrada: ent,
                saida: sai,
                geoLogs: JSON.stringify(registroGeos),
                saldo: diff - 540 
            });

            localStorage.setItem('ponto_v9_db', JSON.stringify(db));
            localStorage.removeItem('ponto_v9_save');
            location.reload();
        }

        function exportarCSV() {
            const db = JSON.parse(localStorage.getItem('ponto_v9_db') || '[]');
            if (db.length === 0) return alert("Não há histórico para exportar.");

            let csv = "Data;Entrada;Saida;Saldo(min);GPS_Logs\n";
            db.forEach(row => {
                csv += `${row.data};${row.entrada};${row.saida};${row.saldo};${row.geoLogs}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "historico_ponto.csv");
            link.click();
        }

        function abrirPlanilha() {
            window.open("https://docs.google.com/spreadsheets/d/1bdq5e9RxZLklrprFTnRoLi08tg7WNCD365JAJDgqo-4/edit", "_blank");
        }

        function renderizarHistorico() {
            const db = JSON.parse(localStorage.getItem('ponto_v9_db') || '[]');
            document.getElementById('lista-historico').innerHTML = db.reverse().map(i => `
                <div class="day-card">
                    <div><strong>${i.data}</strong><br><small>${i.entrada} • ${i.saida}</small></div>
                    <div class="saldo-badge" style="background: ${i.saldo >= 0 ? '#ecfdf5' : '#fef2f2'}; color: ${i.saldo >= 0 ? '#10b981' : '#ef4444'}">
                        ${i.saldo >= 0 ? '+' : ''}${i.saldo}m
                    </div>
                </div>
            `).join('');
        }

        function atualizarTimer() {
            setInterval(() => {
                const ent = document.getElementById('entrada').value;
                if (ent) {
                    const [h, m] = ent.split(':');
                    const meta = new Date(); meta.setHours(parseInt(h) + 9, parseInt(m), 0);
                    const diff = meta - new Date();
                    if (diff > 0) document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
                    else document.getElementById('timer').innerText = "LIBERADO";
                }
            }, 1000);
        }
    </script>
</body>
</html>
