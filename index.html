
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Ponto Inteligente</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
        }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h2 { margin-top: 0; color: #1e293b; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-ponto { background: var(--primary); color: white; width: 100%; margin-bottom: 10px; }
        .btn-ponto:hover { opacity: 0.9; }
        .countdown { font-size: 1.5rem; font-weight: bold; color: var(--primary); text-align: center; margin: 15px 0; }
        .status { text-align: center; font-size: 0.9rem; color: #64748b; }
        .history-grid { display: grid; gap: 10px; width: 100%; max-width: 500px; }
        .day-card { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        .positive { border-left-color: var(--success); color: var(--success); }
        .negative { border-left-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <div class="card">
        <h2>⏱️ Registro de Ponto</h2>
        <button class="btn-ponto" onclick="marcarPontoRapido()">Bater Ponto Agora</button>
        
        <div class="grid-inputs">
            <div><label>Entrada</label><input type="time" id="entrada" oninput="calcular()"></div>
            <div><label>Saída Almoço</label><input type="time" id="almocoSai" oninput="calcular()"></div>
            <div><label>Volta Almoço</label><input type="time" id="almocoVolta" oninput="calcular()"></div>
            <div><label>Saída Final</label><input type="time" id="saida" oninput="calcular()"></div>
        </div>

        <div class="countdown" id="timer">Restam: --:--:--</div>
        <div class="status" id="infoSaida">Preencha a entrada para prever a saída</div>
        <button onclick="salvarDia()" style="margin-top: 15px; width: 100%; background: #1e293b; color: white;">Salvar no Histórico</button>
    </div>

    <div class="card">
        <h3>📊 Banco de Horas (Semanal)</h3>
        <div id="saldoGeral" style="font-size: 1.2rem; font-weight: bold;">Saldo: 00:00</div>
    </div>

    <div class="history-grid" id="historico">
        </div>

    <script>
        const JORNADA_DIARIA = 8 * 60; // 8 horas em minutos

        function calcular() {
            const e = document.getElementById('entrada').value;
            const as = document.getElementById('almocoSai').value;
            const av = document.getElementById('almocoVolta').value;
            const s = document.getElementById('saida').value;

            if (e) {
                // Cálculo de previsão de saída (Entrada + 8h + 1h almoço padrão ou real)
                let [h, m] = e.split(':').map(Number);
                let previsaoMinutos = (h * 60) + m + JORNADA_DIARIA + 60; 
                let pH = Math.floor(previsaoMinutos / 60);
                let pM = previsaoMinutos % 60;
                document.getElementById('infoSaida').innerText = `Saída prevista (com 1h de intervalo): ${String(pH).padStart(2, '0')}:${String(pM).padStart(2, '0')}`;
            }
        }

        function atualizarRegressivo() {
            const e = document.getElementById('entrada').value;
            if (!e) return;

            let agora = new Date();
            let [h, m] = e.split(':').map(Number);
            let entrada = new Date();
            entrada.setHours(h, m, 0);

            // Tempo alvo: Entrada + 8h de trabalho + 1h de almoço
            let alvo = new Date(entrada.getTime() + (9 * 60 * 60 * 1000));
            let diff = alvo - agora;

            if (diff > 0) {
                let hh = Math.floor(diff / 1000 / 60 / 60);
                let mm = Math.floor((diff / 1000 / 60) % 60);
                let ss = Math.floor((diff / 1000) % 60);
                document.getElementById('timer').innerText = `Restam: ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
            } else {
                document.getElementById('timer').innerText = "Jornada Concluída!";
            }
        }

        function marcarPontoRapido() {
            const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            if (!document.getElementById('entrada').value) document.getElementById('entrada').value = agora;
            else if (!document.getElementById('almocoSai').value) document.getElementById('almocoSai').value = agora;
            else if (!document.getElementById('almocoVolta').value) document.getElementById('almocoVolta').value = agora;
            else if (!document.getElementById('saida').value) document.getElementById('saida').value = agora;
            calcular();
        }

        function salvarDia() {
            const dados = {
                data: new Date().toLocaleDateString(),
                entrada: document.getElementById('entrada').value,
                saida: document.getElementById('saida').value,
                // Lógica simplificada de saldo
                saldo: Math.floor(Math.random() * 40) - 20 // Simulação para exemplo
            };
            
            let historico = JSON.parse(localStorage.getItem('ponto_db') || '[]');
            historico.push(dados);
            localStorage.setItem('ponto_db', JSON.stringify(historico));
            renderizarHistorico();
        }

        function renderizarHistorico() {
            const hist = JSON.parse(localStorage.getItem('ponto_db') || '[]');
            const container = document.getElementById('historico');
            container.innerHTML = '';
            
            hist.reverse().slice(0,5).forEach(dia => {
                const classe = dia.saldo >= 0 ? 'positive' : 'negative';
                container.innerHTML += `
                    <div class="day-card ${classe}">
                        <div>
                            <strong>${dia.data}</strong><br>
                            <small>${dia.entrada} ⮕ ${dia.saida || '--:--'}</small>
                        </div>
                        <div>${dia.saldo > 0 ? '+' : ''}${dia.saldo} min</div>
                    </div>
                `;
            });
        }

        setInterval(atualizarRegressivo, 1000);
        renderizarHistorico();
    </script>
</body>
</html>
