
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Pro | Auditoria GPS Mandatória</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #6b7280;
            --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container { width: 100%; max-width: 450px; }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

        .btn-ponto {
            width: 100%;
            height: 64px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            margin-bottom: 24px;
        }

        .btn-ponto:disabled { background: #9ca3af; box-shadow: none; cursor: wait; }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-box {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            position: relative;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-box.unlocked {
            border-color: var(--success);
            background: #f0fdf4;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .input-box label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .input-box input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }

        .input-box input[readonly] { cursor: not-allowed; opacity: 0.6; }

        .edit-trigger {
            position: absolute;
            right: 12px;
            bottom: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--primary);
            padding: 4px;
            background: #eff6ff;
            border-radius: 6px;
        }

        .timer-section {
            text-align: center;
            padding: 16px;
            background: #f8faff;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        #timer { font-size: 2.25rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }

        .geo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #1f2937;
            color: #fff;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .history-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; width: 100%; }
        
        .day-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .saldo-badge {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .btn-finish {
            width: 100%;
            padding: 16px;
            background: var(--text-main);
            color: white;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-finish:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Ponto Pro</h1>
            <p id="display-date" style="color: var(--text-sub); font-size: 0.85rem; margin-top: 4px;"></p>
        </header>

        <div class="card">
            <button id="btnPrincipal" class="btn-ponto" onclick="processarGeolocalizacao('auto')">
                <span>📍</span> Registrar Agora
            </button>

            <div class="grid-inputs">
                <div class="input-box" id="box-entrada">
                    <label>Entrada</label>
                    <input type="time" id="entrada" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" title="Liberar via GPS" onclick="processarGeolocalizacao('manual', 'entrada')">✎</span>
                </div>
                <div class="input-box" id="box-almocoSai">
                    <label>Saída Almoço</label>
                    <input type="time" id="almocoSai" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" title="Liberar via GPS" onclick="processarGeolocalizacao('manual', 'almocoSai')">✎</span>
                </div>
                <div class="input-box" id="box-almocoVolta">
                    <label>Volta Almoço</label>
                    <input type="time" id="almocoVolta" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" title="Liberar via GPS" onclick="processarGeolocalizacao('manual', 'almocoVolta')">✎</span>
                </div>
                <div class="input-box" id="box-saida">
                    <label>Saída Final</label>
                    <input type="time" id="saida" readonly onchange="salvarRascunho()">
                    <span class="edit-trigger" title="Liberar via GPS" onclick="processarGeolocalizacao('manual', 'saida')">✎</span>
                </div>
            </div>

            <div class="timer-section">
                <p style="font-size: 0.65rem; color: var(--text-sub); font-weight: 800; letter-spacing: 0.5px;">TEMPO PARA SAÍDA</p>
                <div id="timer">00:00:00</div>
                <div id="geoDisplay" class="geo-badge">GPS Offline</div>
            </div>

            <button class="btn-finish" onclick="arquivarDia()">Arquivar Registro do Dia</button>
        </div>

        <h3 class="history-title">Histórico de Registros</h3>
        <div id="lista-historico"></div>
    </div>

    <script>
        const CAMPOS = ['entrada', 'almocoSai', 'almocoVolta', 'saida'];
        let registroGeos = {};

        // Inicialização do App
        document.getElementById('display-date').innerText = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'full' }).format(new Date());

        window.onload = () => {
            const rascunho = JSON.parse(localStorage.getItem('ponto_rascunho_v6') || '{}');
            registroGeos = rascunho.geos || {};
            
            CAMPOS.forEach(id => {
                if (rascunho[id]) {
                    const el = document.getElementById(id);
                    el.value = rascunho[id];
                    el.readOnly = false; // Se já estava salvo, mantemos liberado
                    document.getElementById(`box-${id}`).classList.add('unlocked');
                }
            });
            renderizarHistorico();
            atualizarTimer();
        };

        // Função que obriga o GPS para qualquer ação (Auto ou Manual)
        function processarGeolocalizacao(modo, alvo = null) {
            const btn = document.getElementById('btnPrincipal');
            const status = document.getElementById('geoDisplay');
            
            btn.disabled = true;
            status.innerHTML = "<span>🛰️</span> Validando localização...";

            if (!navigator.geolocation) {
                alert("GPS não suportado.");
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const latLon = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                    status.innerHTML = `<span>✅</span> ${latLon}`;
                    
                    if (modo === 'auto') {
                        executarBatidaAuto(latLon);
                    } else {
                        liberarCampoManual(alvo, latLon);
                    }

                    btn.disabled = false;
                },
                (err) => {
                    alert("Acesso negado! O GPS é obrigatório para registrar ou editar.");
                    status.innerHTML = "<span>❌</span> GPS Obrigatório";
                    btn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function executarBatidaAuto(geo) {
            const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            for (let id of CAMPOS) {
                const input = document.getElementById(id);
                if (!input.value) {
                    input.value = hora;
                    input.readOnly = false;
                    document.getElementById(`box-${id}`).classList.add('unlocked');
                    registroGeos[id] = `Auto: ${geo}`;
                    salvarRascunho();
                    break;
                }
            }
        }

        function liberarCampoManual(id, geo) {
            const input = document.getElementById(id);
            input.readOnly = false;
            input.focus();
            document.getElementById(`box-${id}`).classList.add('unlocked');
            registroGeos[id] = `Manual: ${geo}`;
            salvarRascunho();
            alert(`GPS Validado! Você pode ajustar o campo [${id}] agora.`);
        }

        function salvarRascunho() {
            const data = { geos: registroGeos };
            CAMPOS.forEach(id => data[id] = document.getElementById(id).value);
            localStorage.setItem('ponto_rascunho_v6', JSON.stringify(data));
        }

        function arquivarDia() {
            const ent = document.getElementById('entrada').value;
            const sai = document.getElementById('saida').value;
            if (!ent || !sai) return alert("Preencha ao menos Entrada e Saída.");

            const db = JSON.parse(localStorage.getItem('ponto_db_v6') || '[]');
            const minutos = (new Date(`1970-01-01T${sai}`) - new Date(`1970-01-01T${ent}`)) / 60000;
            
            db.push({
                data: new Date().toLocaleDateString('pt-BR'),
                entrada: ent,
                saida: sai,
                saldo: minutos - 540 // 8h trab + 1h almoço
            });

            localStorage.setItem('ponto_db_v6', JSON.stringify(db));
            localStorage.removeItem('ponto_rascunho_v6');
            location.reload();
        }

        function renderizarHistorico() {
            const db = JSON.parse(localStorage.getItem('ponto_db_v6') || '[]');
            document.getElementById('lista-historico').innerHTML = db.reverse().map(i => `
                <div class="day-card">
                    <div class="day-info">
                        <strong>${i.data}</strong>
                        <p>${i.entrada} • ${i.saida}</p>
                    </div>
                    <div class="saldo-badge" style="background: ${i.saldo >= 0 ? '#ecfdf5' : '#fef2f2'}; color: ${i.saldo >= 0 ? '#10b981' : '#ef4444'}">
                        ${i.saldo >= 0 ? '+' : ''}${i.saldo}m
                    </div>
                </div>
            `).join('');
        }

        function atualizarTimer() {
            setInterval(() => {
                const ent = document.getElementById('entrada').value;
                if (ent) {
                    const [h, m] = ent.split(':');
                    const meta = new Date(); meta.setHours(parseInt(h) + 9, parseInt(m), 0);
                    const diff = meta - new Date();
                    if (diff > 0) {
                        document.getElementById('timer').innerText = new Date(diff).toISOString().substr(11, 8);
                    } else {
                        document.getElementById('timer').innerText = "LIBERADO";
                        document.getElementById('timer').style.color = "var(--success)";
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
